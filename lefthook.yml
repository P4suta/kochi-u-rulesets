# lefthook Git hooks manager. Enable with `just install-hooks`.
# https://github.com/evilmartians/lefthook
#
# Hooks mirror CI so failures surface locally, not in Actions.

commit-msg:
  commands:
    committed:
      # Conventional Commits feed release-please's version + CHANGELOG derivation.
      # {1} = the commit-message file git hands the commit-msg hook. Do not bypass
      # with --no-verify.
      run: committed --commit-file {1}
      fail_text: "Commit message is not a valid Conventional Commit (see committed.toml)"

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --check
      fail_text: "rustfmt violations; fix with `just fmt`"
    typos:
      run: typos

pre-push:
  parallel: false
  commands:
    rust:
      run: cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
      fail_text: "Rust checks failed (clippy/test); see `just check`"
