# Dev tool versions. `mise install` sets them all up.
# https://mise.jdx.dev/

[tools]
just = "latest"
lefthook = "latest"
typos = "latest"
actionlint = "latest"
# Frontend (web/): Svelte 5 + Vite, managed with pnpm (not npm/bun).
node = "latest"
pnpm = "latest"
# The Rust toolchain is pinned by rust-toolchain.toml; wasm-pack is installed
# separately (cargo install wasm-pack) — it is not in the mise registry.
