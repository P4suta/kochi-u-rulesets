name: Sync rulesets

# Mirror the 高知大学 規則集 index weekly: pull the latest PDFs into sources/ and
# refresh manifest.json, landing any change on main as a signed Verified commit.
# The commit diff (manifest.json = structural changes; the insta snapshots that
# CI regenerates on a parse drift = content changes) is the "what changed" report.
# Generated site data is NOT committed — deploy.yml regenerates it from sources/.

on:
  schedule:
    # 19:00 UTC Monday = 04:00 JST Tuesday (low-traffic early morning).
    - cron: '0 19 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Sync only, without committing
        type: boolean
        default: false

permissions:
  contents: write   # land sources/ + manifest.json on main via the GitHub API

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Build
        run: cargo build --release -p kochi-university-regulations

      - name: Sync index → sources/ + manifest.json
        run: ./target/release/kochi-university-regulations sync

      - name: Commit if changed
        if: ${{ !inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./target/release/kochi-university-regulations commit \
            --path sources --path manifest.json \
            --message "chore: sync rulesets ($(date -u +%Y-%m-%d))"

      # A GITHUB_TOKEN push does not trigger other workflows, so kick the deploy
      # explicitly to republish the site from the freshly synced sources.
      - name: Trigger site deploy
        if: ${{ !inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
