[package]
name = "kochi-u-rulesets"
version = "0.1.0"
edition = "2024"

[lib]
name = "kochi_u_rulesets"
path = "src/lib.rs"

[[bin]]
name = "kochi-u-rulesets"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
pdf-extract = "0.12.0"
regex = "1.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
serde_json = "1.0.150"
