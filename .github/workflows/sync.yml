name: Sync rulesets

# Mirror the regulation index into a signed draft pull request.

on:
  schedule:
    # 19:00 UTC Monday = 04:00 JST Tuesday (low-traffic early morning).
    - cron: '0 19 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Sync without creating or updating a pull request
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      operation: ${{ steps.proposal.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2

      - name: Build
        run: cargo build --release -p kochi-university-regulations

      - name: Sync index → sources/ + manifest.json
        run: ./target/release/kochi-university-regulations sync

      - name: Propose changed sources
        id: proposal
        if: ${{ !inputs.dry-run }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            manifest.json
            sources/*.pdf
          branch: automation/ruleset-sync
          base: main
          sign-commits: true
          delete-branch: true
          draft: always-true
          commit-message: 'chore(data): sync rulesets'
          title: 'chore(data): sync rulesets'
          body: |
            Mirror the university's regulation index into the PDF sources and manifest.
            Review the source changes and any changed parser snapshots before merging.

            @coderabbitai ignore

      - name: Verify proposal signature
        if: ${{ steps.proposal.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROPOSAL_HEAD: ${{ steps.proposal.outputs.pull-request-head-sha }}
        run: test "$(gh api "repos/$GH_REPO/commits/$PROPOSAL_HEAD" --jq '.commit.verification.verified')" = true

  verify:
    needs: sync
    if: ${{ needs.sync.outputs.operation == 'created' || needs.sync.outputs.operation == 'updated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch required checks for the proposal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run required.yml --repo "$GH_REPO" --ref automation/ruleset-sync
