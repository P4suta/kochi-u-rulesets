# Native CLI: mirrors the regulation index and generates structured site data.
# Network and filesystem effects stay here so `crates/core` remains portable.
[package]
name = "kochi-university-regulations"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kochi-university-regulations"
path = "src/main.rs"

[dependencies]
kochi-university-regulations-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.0", default-features = false, features = ["blocking", "json", "rustls"] }
scraper = "0.29.0"
