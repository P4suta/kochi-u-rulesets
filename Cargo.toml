# Workspace root. The pure parsing/rendering logic lives in `crates/core` and is
# compiled two ways: natively by `crates/cli` (build-time data generation) and to
# wasm32 by `crates/wasm` (in-browser live parser + query engine). `model::Document`
# (serde) is the single contract shared by both targets and the frontend.
[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.103"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.13.0"
pdf-extract = "0.12.0"
kochi-university-regulations-core = { path = "crates/core" }
