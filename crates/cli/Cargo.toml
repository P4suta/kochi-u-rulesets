# Native CLI: syncs the university's 規則集 index, parses `sources/*.pdf` into
# structured JSON/MD + search index + reference graph (build-time preprocessing),
# and commits changes via the GitHub API. Owns the wasm-incompatible deps
# (reqwest, scraper, clap) so `crates/core` stays wasm-pure.
[package]
name = "kochi-university-regulations"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kochi-university-regulations"
path = "src/main.rs"

[dependencies]
kochi-university-regulations-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
base64 = "0.23.0"
reqwest = { version = "0.13.0", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = "0.27.0"
